    <h4>Fill out the form below, and our team will get in touch with you shortly.</h4>
    <div class="form-area">
      <form>
        <div class="form-row">
          <div class="info 1">
            <label for="fname">
              <h5>First name: </h5>
            </label>
            <input type="text" id="fname" placeholder="John">
          </div>
          <div class="info 2">

        <div class="form-row">

            </label>

          </div>
          <div class="info 4">
            <label for="phone">
              <h5>Last Name: </h5>
            </label>
            <input type="tel" id="phone" placeholder="(13) 99999-9999">
          </div>
        </div>
        <div class="form-row">
          <div class="info 5">
            <label for="message">
              <h5>Your Message: </h5>
            </label>
            <textarea id="message"></textarea>
          </div>
        </div>
        <input type="submit" id="submit" value="Submit">
      </form>
